name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 7200

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          Write-Host "Remote Desktop enabled."

      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $Password = ConvertTo-SecureString `
            "P@ssw0rd1qazXSW@#" `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          Write-Host "Admin account ready."

      - name: 3. Install & Connect Tailscale VPN
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

        run: |
          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 5

          Write-Host "Connecting to Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "        >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Open mstsc and connect to:" -ForegroundColor Magenta
          Write-Host "$ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive - 5 Days
        shell: powershell
        run: |
          # 5 days = 7200 minutes
          $TotalMinutes = 5 * 24 * 60

          Write-Host "Keeping server alive for 5 days..."
          Write-Host "Total minutes: $TotalMinutes"

          for ($i = 1; $i -le $TotalMinutes; $i++) {

              Start-Sleep -Seconds 60

              $hours = [math]::Floor($i / 60)
              $minutes = $i % 60

              Write-Host "[$i/$TotalMinutes] Server running - ${hours}h ${minutes}m"
          }
